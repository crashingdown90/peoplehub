# PeopleHub Deployment Pipeline
#
# Continuous Deployment workflow for PeopleHub HRIS
# Deploys to staging (develop branch) or production (main branch)
#
# Prerequisites:
# - GitHub Secrets configured:
#   - STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
#   - PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KEY
#   - SLACK_WEBHOOK (optional)

name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'

jobs:
  # Run CI checks first
  ci:
    uses: ./.github/workflows/ci.yml

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.peoplehub.kreatifindo.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /var/www/peoplehub
            
            echo "📥 Pulling latest code..."
            git fetch origin develop
            git reset --hard origin/develop
            
            echo "📦 Installing dependencies..."
            npm ci --production=false
            
            echo "🔧 Generating Prisma client..."
            npx prisma generate
            
            echo "🔄 Running migrations..."
            npx prisma migrate deploy
            
            echo "🔨 Building application..."
            npm run build
            
            echo "🔄 Restarting application..."
            pm2 reload peoplehub-staging --update-env || pm2 start ecosystem.config.js --env staging
            
            echo "🏥 Running health check..."
            sleep 5
            curl -sf http://localhost:3000/api/health || exit 1
            
            echo "✅ Deployment successful!"

      - name: Notify Slack (Success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,action
          text: '🚀 Staging deployment successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Notify Slack (Failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action
          text: '❌ Staging deployment failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://peoplehub.kreatifindo.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "📦 Creating pre-deployment backup..."
            /var/www/peoplehub/scripts/backup-database.sh
        continue-on-error: false

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /var/www/peoplehub
            
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Installing dependencies..."
            npm ci --production=false
            
            echo "🔧 Generating Prisma client..."
            npx prisma generate
            
            echo "🔄 Running migrations..."
            npx prisma migrate deploy
            
            echo "🔨 Building application..."
            npm run build
            
            echo "🔄 Restarting application (zero-downtime)..."
            pm2 reload peoplehub --update-env
            
            echo "🏥 Running health check..."
            sleep 5
            curl -sf http://localhost:3000/api/health || exit 1
            
            echo "✅ Production deployment successful!"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "⚠️ Deployment failed, attempting rollback..."
            cd /var/www/peoplehub
            /var/www/peoplehub/scripts/rollback.sh
        continue-on-error: true

      - name: Notify Slack (Success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,action
          text: '🚀 Production deployment successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Notify Slack (Failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action
          text: '❌ Production deployment failed! Rollback initiated.'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # Post-deployment verification
  verify:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
      - name: Verify Staging
        if: needs.deploy-staging.result == 'success'
        run: |
          echo "Verifying staging deployment..."
          response=$(curl -sf https://staging.peoplehub.kreatifindo.com/api/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q '"status":"healthy"'; then
            echo "✅ Staging is healthy"
          else
            echo "❌ Staging health check failed"
            exit 1
          fi
        continue-on-error: true

      - name: Verify Production
        if: needs.deploy-production.result == 'success'
        run: |
          echo "Verifying production deployment..."
          response=$(curl -sf https://peoplehub.kreatifindo.com/api/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q '"status":"healthy"'; then
            echo "✅ Production is healthy"
          else
            echo "❌ Production health check failed"
            exit 1
          fi
        continue-on-error: true
