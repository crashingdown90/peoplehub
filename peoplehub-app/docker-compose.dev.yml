# Development override - use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
version: '3.8'

services:
  app:
    container_name: peoplehub-app-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Bind mount source for hot reload
      - ./src:/app/src:cached
      - ./public:/app/public:cached
      - ./prisma:/app/prisma:cached
      - ./scripts:/app/scripts:cached
      # Named volumes for optimization
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: npm run dev
    
volumes:
  node_modules:
  next_cache:
