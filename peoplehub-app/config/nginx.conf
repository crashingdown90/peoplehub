# =============================================================================
# PeopleHub Nginx Configuration
# =============================================================================
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/peoplehub
#   2. Create symlink: ln -s /etc/nginx/sites-available/peoplehub /etc/nginx/sites-enabled/
#   3. Test config: nginx -t
#   4. Reload: systemctl reload nginx
#
# Prerequisites:
#   - SSL certificate (via Certbot or manual)
#   - Next.js app running on port 3000
# =============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name peoplehub.kreatifindo.com;
    
    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peoplehub.kreatifindo.com;

    # ==========================================================================
    # SSL Configuration
    # ==========================================================================
    ssl_certificate /etc/letsencrypt/live/peoplehub.kreatifindo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplehub.kreatifindo.com/privkey.pem;
    
    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==========================================================================
    # Security Headers
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    
    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.peoplehub.kreatifindo.com; frame-ancestors 'self';" always;

    # ==========================================================================
    # Logging
    # ==========================================================================
    access_log /var/log/nginx/peoplehub.access.log;
    error_log /var/log/nginx/peoplehub.error.log;

    # ==========================================================================
    # Performance
    # ==========================================================================
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;

    # Client limits
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ==========================================================================
    # Proxy to Next.js Application
    # ==========================================================================
    
    # Main application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Static files with long cache
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, immutable, max-age=31536000";
        
        # Performance headers
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public assets
    location /public {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check endpoint (for monitoring)
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        proxy_read_timeout 5s;
    }

    # Metrics endpoint (restrict access)
    location /api/metrics {
        proxy_pass http://127.0.0.1:3000;
        # Restrict to internal/monitoring IPs
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|package\.json|package-lock\.json|tsconfig\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# Upstream configuration (for load balancing multiple instances)
# =============================================================================
# Uncomment and modify for multi-server setup:
#
# upstream peoplehub_backend {
#     least_conn;
#     server 127.0.0.1:3000 weight=5;
#     server 127.0.0.1:3001 weight=5;
#     server 10.0.0.2:3000 backup;
#     keepalive 32;
# }
#
# Then replace proxy_pass http://127.0.0.1:3000; with:
# proxy_pass http://peoplehub_backend;
